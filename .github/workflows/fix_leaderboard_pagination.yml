name: Fix leaderboard pagination
on:
  push:
    paths:
      - '.github/sam_aim_leaderboard_pagination.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '''    const pageSize = 10;\n    const totalPages = Math.max(1, Math.ceil(leaderboardData.length / pageSize));'''
          new1 = '''    const pageSize = 10;\n    const totalPlayers = Number(data.total_players || leaderboardData.length);\n    const totalPages = Math.max(1, Math.ceil(totalPlayers / pageSize));'''
          if old1 not in s:
              raise SystemExit('initial pagination block not found')
          s = s.replace(old1, new1, 1)
          old2 = '''    const { data, error } = await supabaseClient.rpc("get_leaderboard", {\n      p_session_token: sessionToken,\n      p_page: Number(page)\n    });'''
          new2 = '''    const { data, error } = await supabaseClient.rpc("get_leaderboard", {\n      p_session_token: sessionToken,\n      p_page: Number(page),\n      p_page_size: 10\n    });'''
          if old2 not in s:
              raise SystemExit('page RPC block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix leaderboard pagination to 10 players per page' || exit 0
          git push
